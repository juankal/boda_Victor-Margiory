<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" class="bouquet-svg">
  <defs>
    <radialGradient id="goldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="45%" stop-color="#caa160"/>
      <stop offset="100%" stop-color="#805d20"/>
    </radialGradient>
    <radialGradient id="navyRoseGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2d5386"/>
      <stop offset="55%" stop-color="#122744"/>
      <stop offset="100%" stop-color="#060f1c"/>
    </radialGradient>
    <radialGradient id="whiteAnemoneGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f0e4"/>
      <stop offset="100%" stop-color="#dfd3be"/>
    </radialGradient>
    <radialGradient id="anemoneCenterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1e36"/>
      <stop offset="75%" stop-color="#091322"/>
      <stop offset="100%" stop-color="#040810"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ramas y Hojas Doradas de Fondo -->
  <g class="gold-foliage" filter="url(#softShadow)">
    <path d="M40,200 Q90,120 140,70 Q160,50 190,25" stroke="url(#goldGrad)" stroke-width="2.8" fill="none"/>
    <path d="M100,135 Q145,100 165,45" stroke="url(#goldGrad)" stroke-width="2.2" fill="none"/>
    <path d="M80,165 Q115,145 130,115" stroke="url(#goldGrad)" stroke-width="1.8" fill="none"/>
    
    <!-- Hojas de laurel/eucalipto doradas -->
    <ellipse cx="180" cy="35" rx="16" ry="8" transform="rotate(-30 180 35)" fill="url(#goldGrad)"/>
    <ellipse cx="150" cy="60" rx="17" ry="9" transform="rotate(-40 150 60)" fill="url(#goldGrad)"/>
    <ellipse cx="120" cy="90" rx="18" ry="9" transform="rotate(-50 120 90)" fill="url(#goldGrad)"/>
    <ellipse cx="165" cy="50" rx="14" ry="7" transform="rotate(20 165 50)" fill="url(#goldGrad)"/>
    <ellipse cx="140" cy="85" rx="15" ry="7" transform="rotate(25 140 85)" fill="url(#goldGrad)"/>
    <ellipse cx="95" cy="125" rx="14" ry="7" transform="rotate(-65 95 125)" fill="url(#goldGrad)"/>
    
    <!-- Bayas doradas en racimo -->
    <circle cx="200" cy="22" r="4" fill="url(#goldGrad)"/>
    <circle cx="210" cy="32" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="195" cy="42" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="185" cy="20" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Rosa Azul Marino Profunda (Izquierda) -->
  <g class="navy-rose-cluster" filter="url(#softShadow)" transform="translate(65, 125)">
    <ellipse cx="0" cy="0" rx="42" ry="38" fill="url(#navyRoseGrad)"/>
    <path d="M-32,-12 C-20,-34 20,-34 32,-12 C40,8 25,32 0,34 C-25,32 -40,8 -32,-12" fill="none" stroke="#3b659c" stroke-width="1.6" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="26" ry="24" fill="#0d1f38"/>
    <path d="M-16,-10 C-8,-20 8,-20 16,-10 C20,0 12,16 0,18 C-12,16 -20,0 -16,-10" fill="none" stroke="#5b88c4" stroke-width="1.8" opacity="0.7"/>
    <circle cx="0" cy="0" r="12" fill="#1b365e"/>
    <circle cx="0" cy="0" r="5" fill="#caa160" opacity="0.9"/>
  </g>

  <!-- Flor Blanca Anémona con Centro Azul Medianoche y Estambres Dorados -->
  <g class="white-anemone-flower" filter="url(#softShadow)" transform="translate(140, 145)">
    <ellipse cx="0" cy="-34" rx="18" ry="26" fill="url(#whiteAnemoneGrad)"/>
    <ellipse cx="29" cy="-17" rx="18" ry="26" transform="rotate(60 29 -17)" fill="url(#whiteAnemoneGrad)"/>
    <ellipse cx="29" cy="17" rx="18" ry="26" transform="rotate(120 29 17)" fill="url(#whiteAnemoneGrad)"/>
    <ellipse cx="0" cy="34" rx="18" ry="26" fill="url(#whiteAnemoneGrad)"/>
    <ellipse cx="-29" cy="17" rx="18" ry="26" transform="rotate(-120 -29 17)" fill="url(#whiteAnemoneGrad)"/>
    <ellipse cx="-29" cy="-17" rx="18" ry="26" transform="rotate(-60 -29 -17)" fill="url(#whiteAnemoneGrad)"/>
    
    <!-- Centro azul marino oscuro -->
    <circle cx="0" cy="0" r="16" fill="url(#anemoneCenterGrad)"/>
    <circle cx="0" cy="0" r="17" fill="none" stroke="#050a12" stroke-width="1.5"/>
    
    <!-- Corona de estambres en oro -->
    <circle cx="0" cy="-13" r="2" fill="url(#goldGrad)"/>
    <circle cx="9" cy="-9" r="2" fill="url(#goldGrad)"/>
    <circle cx="13" cy="0" r="2" fill="url(#goldGrad)"/>
    <circle cx="9" cy="9" r="2" fill="url(#goldGrad)"/>
    <circle cx="0" cy="13" r="2" fill="url(#goldGrad)"/>
    <circle cx="-9" cy="9" r="2" fill="url(#goldGrad)"/>
    <circle cx="-13" cy="0" r="2" fill="url(#goldGrad)"/>
    <circle cx="-9" cy="-9" r="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Florecitas de relleno Baby Blue y Destellos -->
  <g class="filler-blossoms">
    <circle cx="175" cy="105" r="7" fill="#8eb5dd"/>
    <circle cx="175" cy="105" r="2.5" fill="#caa160"/>
    
    <circle cx="195" cy="120" r="6" fill="#8eb5dd"/>
    <circle cx="195" cy="120" r="2" fill="#caa160"/>

    <circle cx="50" cy="85" r="7" fill="#8eb5dd"/>
    <circle cx="50" cy="85" r="2.5" fill="#caa160"/>

    <circle cx="70" cy="65" r="5" fill="#8eb5dd"/>
    <circle cx="70" cy="65" r="2" fill="#caa160"/>

    <!-- Puntos de pan de oro flotantes -->
    <circle cx="130" cy="30" r="2" fill="#caa160" opacity="0.8"/>
    <circle cx="85" cy="45" r="2.5" fill="#caa160" opacity="0.8"/>
    <circle cx="215" cy="70" r="2" fill="#caa160" opacity="0.8"/>
  </g>
</svg>